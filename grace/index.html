<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Preços</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            text-align: center;
            color: #2d3748;
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 24px;
        }
        
        .tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 12px 16px;
            font-weight: 600;
            color: #718096;
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            text-align: center;
            flex: 1;
            min-width: 100px;
        }
        
        .tab:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }
        
        .tab.active {
            color: #ffffff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        p.result {
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            margin-top: 20px;
            padding: 16px;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.3);
        }

        .section {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .section.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group h2 {
            color: #2d3748;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            padding: 12px;
            background: #f7fafc;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .input-group h2.mais-barata {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border-left-color: #38a169;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 6px;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background: white;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        input[type="number"]::placeholder {
            color: #a0aec0;
        }
        
        button {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 24px;
                margin: 16px;
            }
            
            .tabs {
                gap: 4px;
            }
            
            .tab {
                font-size: 12px;
                padding: 10px 12px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Comparador de Preços</h1>
        <p class="subtitle">Compare preços, calcule descontos e muito mais</p>

        <!-- Abas para Alternar entre as Seções -->
        <div class="tabs">
            <div class="tab active" onclick="toggleTab('compararOpcoesTab')">Comparar Opções</div>
            <div class="tab" onclick="toggleTab('calcularValorTab')">Calcular por Peso</div>
            <div class="tab" onclick="toggleTab('calcularDescontoTab')">Calcular Desconto</div>
            <div class="tab" onclick="toggleTab('compararProporcaoTab')">Proporção Peso/Volume</div>
        </div>

        <!-- Seção Comparar Preços entre Opções -->
        <div id="compararOpcoesTab" class="section active">
            <div class="input-group">
                <h2 id="tituloOp1">Opção 1</h2>
                <label>Quantidade:</label>
                <input type="number" id="quantidade1" placeholder="Digite a quantidade">
                <label>Valor (R$):</label>
                <input type="number" id="valor1" placeholder="Digite o valor">
          
            </div>
            <div class="input-group">
                <h2 id="tituloOp2">Opção 2</h2>
                <label>Quantidade:</label>
                <input type="number" id="quantidade2" placeholder="Digite a quantidade">
                <label>Valor (R$):</label>
                <input type="number" id="valor2" placeholder="Digite o valor">
 
            </div>
            <button onclick="compararOpcoes()">Comparar Opções</button>
            <p class="result" id="resultadoOpcao"></p>
        </div>

        <!-- Seção Calcular Valor por Peso -->
        <div id="calcularValorTab" class="section">
            <div class="input-group">
                <label>Valor por quilo (R$):</label>
                <input type="number" id="valorKilo" placeholder="Digite o valor por quilo">
                <label>Quantidade em gramas:</label>
                <input type="number" id="gramas" placeholder="Digite a quantidade em gramas">
            </div>
            <button onclick="calcularValorPorPeso()">Calcular Valor</button>
            <p class="result" id="resultadoPeso"></p>
        </div>

        <!-- Seção Calcular Valor com Desconto -->
        <div id="calcularDescontoTab" class="section">
            <div class="input-group">
                <label>Valor Original (R$):</label>
                <input type="number" id="valorOriginal" placeholder="Digite o valor original">
                <label>Desconto (%):</label>
                <input type="number" id="percentualDesconto" placeholder="Digite o percentual de desconto">
            </div>
            <button onclick="calcularValorComDesconto()">Calcular com Desconto</button>
            <p class="result" id="resultadoDesconto"></p>
        </div>

        <!-- Seção Comparar Proporção Peso/Volume -->
        <div id="compararProporcaoTab" class="section">
            <div class="input-group">
                <label>Peso Opção 1 (g):</label>
                <input type="number" id="peso1" placeholder="Digite o peso da opção 1">
                <label>Volume Opção 1 (ml):</label>
                <input type="number" id="volume1" placeholder="Digite o volume da opção 1">
            </div>
            <div class="input-group">
                <label>Peso Opção 2 (g):</label>
                <input type="number" id="peso2" placeholder="Digite o peso da opção 2">
                <label>Volume Opção 2 (ml):</label>
                <input type="number" id="volume2" placeholder="Digite o volume da opção 2">
            </div>
            <button onclick="compararProporcaoPesoVolume()">Comparar Proporções</button>
            <p class="result" id="resultadoProporcao"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
